dataset_query:
  database: Dev DB
  stages:
  - native: "-- WITH as_of_date AS (\n--   SELECT MAX(issue_date) AS selected_date\n--   FROM datamart.a_registered_owner_detailed_report t\n--   WHERE 1=1\n--   [[AND {{Date_Range}}]]\n-- ),\n-- filtered_holdings AS (\n--   SELECT *\n--   FROM datamart.a_registered_owner_detailed_report t\n--   CROSS JOIN as_of_date a\n--   WHERE\n--     1=1\n-- \tAND t.reversed_at IS NULL\n--     AND t.issue_date <= a.selected_date\n--     [[AND {{Issuer_Name}}]]\n--     [[AND {{Issue_Name}}]]\n--     [[AND {{issuer_id}}]]\n--     [[AND {{tasp_id}}]]\n--     [[AND {{Date_Range}}]]\n-- ),\n-- active_holdings AS (\n--   SELECT\n--     fh.*,\n--     CASE\n--       WHEN fh.cancel_transaction_date IS NULL\n--         OR NULLIF(fh.cancel_transaction_date::text, '')::date > fh.selected_date\n--       THEN 'Active'::text\n--       ELSE 'Inactive'::text\n--     END AS dynamic_status\n--   FROM filtered_holdings fh\n-- )\n-- SELECT\n--   ah.tax_lot_id                             AS \"Tax Lot ID\",\n--   ah.registered_owner_id                    AS \"Registered Owner ID\",\n--   ah.legal_name                             AS \"Legal Name\",\n--   ah.holder_type                            AS \"Holder Type\",\n--   ah.holder_subtype                         AS \"Holder Subtype\",\n--   ah.registered_owner_tin                   AS \"Registered Owner TIN\",\n--   ah.holding_type                           AS \"Holding Type\",\n--   ah.drs_book_account_or_certificate_number AS \"DRS/Book/Certificate Number\",\n--   ah.issue_date                             AS \"Issue Date\",\n--   ah.month                                  AS \"Month\",\n--   ah.month_name                             AS \"Month Name\",\n--   ah.year                                   AS \"Year\",\n--   ah.quantity                               AS \"Quantity\",\n--   ah.legends                                AS \"Legends\",\n--   ah.position_stop                          AS \"Position Stop\",\n--   ah.holder_stop                            AS \"Holder Stop\",\n--   ah.legends_or_stops                       AS \"Legends or Stops\",\n--   ah.acquisition_date                       AS \"Acquisition Date\",\n--   ah.cost_basis                             AS \"Cost Basis\",\n--   ah.gift_inheritance_indicator             AS \"Gift/Inheritance Indicator\",\n--   ah.gift_fmv                               AS \"Gift FMV\",\n--   ah.tax_country                            AS \"Tax Country\",\n--   ah.street_address                         AS \"Street Address\",\n--   ah.country                                AS \"Country\",\n--   ah.state                                  AS \"State\",\n--   ah.city                                   AS \"City\",\n--   ah.postal_code                            AS \"Postal Code\",\n--   ah.email_address                          AS \"Email Address\",\n--   ah.phone_number                           AS \"Phone Number\",\n--   ah.lost_holder                            AS \"Lost Holder\",\n--   ah.date_of_last_contact                   AS \"Date of Last Contact\",\n--   ah.affiliate                              AS \"Affiliate\",\n--   ah.section_16_officer                     AS \"Section 16 Officer\",\n--   ah.dynamic_status                         AS \"Status\",\n--   ah.associated_user_name_1                 AS \"Associated User Name 1\",\n--   ah.associated_user_tin_1                  AS \"Associated User TIN 1\",\n--   ah.associated_user_name_2                 AS \"Associated User Name 2\",\n--   ah.associated_user_tin_2                  AS \"Associated User TIN 2\",\n--   ah.associated_user_name_3                 AS \"Associated User Name 3\",\n--   ah.associated_user_tin_3                  AS \"Associated User TIN 3\",\n--   ah.cancel_transaction_date                AS \"Cancel Transaction Date\",\n--   ah.cancel_transaction_type                AS \"Cancel Transaction Type\",\n--   ah.tax_lot_status                         AS \"Tax Lot Status\",\n--   ah.holdings_range                         AS \"Holdings Range\",\n--   ah.holdings_range_order                   AS \"Holdings Range Order\",\n--   ah.corrected                              AS \"Corrected\",\n--   ah.reported_to_irs                        AS \"Reported to IRS\",\n--   ah.issue_name                             AS \"Issue Name\",\n--   ah.cusip                                  AS \"CUSIP\",\n--   ah.ticker                                 AS \"Ticker\",\n--   ah.issuer_id                              AS \"Issuer ID\",\n--   ah.issuer_legal_name                      AS \"Issuer Legal Name\",\n--   ah.issuer_issue                           AS \"Issuer Issue\",\n--   ah.tasp_name                              AS \"TASP Name\",\n--   ah.tasp_id                                AS \"TASP ID\",\n--   ah.cancel_transaction_id                  AS \"Cancel Transaction ID\",\n--   ah.stakeholder_id                         AS \"Stakeholder ID\",\n--   ah.issue_id                               AS \"Issue ID\",\n--   ah.transaction_id                         AS \"Transaction ID\"\n-- FROM active_holdings ah\n-- ORDER BY\n--   ah.legal_name ASC,\n--   ah.issue_date ASC;\n\n\n\n\n\nWITH as_of_date AS (\n  SELECT MAX(issue_date) AS selected_date\n  FROM datamart.a_registered_owner_detailed_report t\n  WHERE 1=1\n  [[AND {{Date_Range}}]]\n),\nfiltered_holdings AS (\n  SELECT *\n  FROM datamart.a_registered_owner_detailed_report t\n  CROSS JOIN as_of_date a\n  WHERE\n    1=1\n    AND t.reversed_at IS NULL\n    AND t.issue_date <= a.selected_date\n    [[AND {{Issuer_Name}}]]\n    [[AND {{Issue_Name}}]]\n    [[AND {{issuer_id}}]]\n    [[AND {{tasp_id}}]]\n    [[AND {{Date_Range}}]]\n    [[AND {{Registered_Holder}}]]\n    [[AND {{Holder_Type}}]]\n    [[AND {{Holding_Type}}]]\n    [[AND {{Legends}}]]\n    [[AND {{Tax_Lot_Status}}]]\n    [[AND {{Range}}]]\n    [[AND {{Position_Stop}}]]\n    [[AND {{Holder_Stop}}]]\n    [[AND {{Country}}]]\n),\nactive_holdings AS (\n  SELECT\n    fh.*,\n    CASE\n      WHEN fh.cancel_transaction_date IS NULL\n        OR NULLIF(fh.cancel_transaction_date::text, '')::date > fh.selected_date\n      THEN 'Active'::text\n      ELSE 'Inactive'::text\n    END AS dynamic_status\n  FROM filtered_holdings fh\n)\nSELECT\n  ah.tax_lot_id                             AS \"Tax Lot ID\",\n  ah.registered_owner_id                    AS \"Registered Owner ID\",\n  ah.legal_name                             AS \"Legal Name\",\n  ah.holder_type                            AS \"Holder Type\",\n  ah.holder_subtype                         AS \"Holder Subtype\",\n  ah.registered_owner_tin                   AS \"Registered Owner TIN\",\n  ah.holding_type                           AS \"Holding Type\",\n  ah.drs_book_account_or_certificate_number AS \"DRS/Book/Certificate Number\",\n  ah.issue_date                             AS \"Issue Date\",\n  ah.quantity                               AS \"Quantity\",\n  ah.legends                                AS \"Legends\",\n  ah.position_stop                          AS \"Position Stop\",\n  ah.holder_stop                            AS \"Holder Stop\",\n  ah.legends_or_stops                       AS \"Legends or Stops\",\n  ah.acquisition_date                       AS \"Acquisition Date\",\n  ah.cost_basis                             AS \"Cost Basis\",\n  ah.gift_inheritance_indicator             AS \"Gift/Inheritance Indicator\",\n  ah.gift_fmv                               AS \"Gift FMV\",\n  ah.tax_country                            AS \"Tax Country\",\n  ah.street_address                         AS \"Street Address\",\n  ah.country                                AS \"Country\",\n  ah.state                                  AS \"State\",\n  ah.city                                   AS \"City\",\n  ah.postal_code                            AS \"Postal Code\",\n  ah.email_address                          AS \"Email Address\",\n  ah.phone_number                           AS \"Phone Number\",\n  ah.lost_holder                            AS \"Lost Holder\",\n  ah.date_of_last_contact                   AS \"Date of Last Contact\",\n  ah.affiliate                              AS \"Affiliate\",\n  ah.section_16_officer                     AS \"Section 16 Officer\",\n  ah.dynamic_status                         AS \"Status\",\n  ah.associated_user_name_1                 AS \"Associated User Name 1\",\n  ah.associated_user_tin_1                  AS \"Associated User TIN 1\",\n  ah.associated_user_name_2                 AS \"Associated User Name 2\",\n  ah.associated_user_tin_2                  AS \"Associated User TIN 2\",\n  ah.associated_user_name_3                 AS \"Associated User Name 3\",\n  ah.associated_user_tin_3                  AS \"Associated User TIN 3\",\n  ah.cancel_transaction_date                AS \"Cancel Transaction Date\",\n  ah.cancel_transaction_type                AS \"Cancel Transaction Type\",\n  ah.tax_lot_status                         AS \"Tax Lot Status\",\n  ah.holdings_range                         AS \"Holdings Range\",\n  ah.holdings_range_order                   AS \"Holdings Range Order\",\n  ah.corrected                              AS \"Corrected\",\n  ah.reported_to_irs                        AS \"Reported to IRS\",\n  ah.issue_name                             AS \"Issue Name\",\n  ah.cusip                                  AS \"CUSIP\",\n  ah.ticker                                 AS \"Ticker\",\n  ah.issuer_id                              AS \"issuer_id\",\n  ah.issuer_legal_name                      AS \"Issuer Legal Name\",\n  ah.issuer_issue                           AS \"Issuer Issue\",\n  ah.tasp_name                              AS \"TASP Name\",\n  ah.tasp_id                                AS \"tasp_id\"\nFROM active_holdings ah\nWHERE\n  1=1\n  [[AND ah.dynamic_status = {{Status}}]]\nORDER BY\n  ah.legal_name ASC,\n  ah.issue_date ASC;"
