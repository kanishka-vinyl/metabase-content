dataset_query:
  database: Canned DB
  stages:
  - native: "WITH as_of_date AS (\n  SELECT MAX(issue_date) AS selected_date\n  FROM datamart.a_geographical_summary_report t\n  WHERE 1=1\n  [[AND {{Date_Range}}]]\n),\nfiltered_holdings AS (\n  SELECT\n    t.tax_lot_id,\n    t.registered_owner_id,\n    t.quantity,\n    t.cancel_transaction_date,\n    t.issue_date,\n    t.issue_id,\n    t.tax_country,\n    t.issue_name,\n    t.issuer_issue,\n    t.issuer_legal_name,\n    t.tasp_name,\n    t.cusip,\n    t.ticker\n  FROM\n    datamart.a_geographical_summary_report t\n  WHERE\n    1=1\n    AND t.reversed_at IS NULL\n    AND t.transaction_type <> 'CANCELLATION'\n    AND t.tax_lot_is_deleted IS NOT TRUE\n    [[AND {{Issuer_Name}}]]\n    [[AND {{Issue_Name}}]]\n    [[AND {{Date_Range}}]]\n\t[[AND {{Issuer_id}}]]\n   [[AND {{tasp_id}}]]\n),\n-- Only keep active lots as of the selected date\nactive_holdings AS (\n  SELECT fh.*\n  FROM filtered_holdings fh\n  CROSS JOIN as_of_date a\n  WHERE\n    fh.cancel_transaction_date IS NULL\n    OR NULLIF(fh.cancel_transaction_date, '')::date > a.selected_date\n)\nSELECT\n  COALESCE(ah.tax_country, 'N/A')          AS \"State/Country\",\n  SUM(ah.quantity)                          AS \"Total Securities Held\",\n  COUNT(DISTINCT ah.registered_owner_id)    AS \"Total Holders\",\n  ah.issue_name                             AS \"Issue Name\",\n  ah.issuer_issue                           AS \"Issuer Issue\",\n  ah.issuer_legal_name                      AS \"Issuer Legal Name\",\n  ah.tasp_name                              AS \"TASP Name\",\n  ah.cusip                                  AS \"CUSIP\",\n  ah.ticker                                 AS \"Ticker\"\nFROM active_holdings ah\nGROUP BY\n  ah.tax_country,\n  ah.issue_name,\n  ah.issuer_issue,\n  ah.issuer_legal_name,\n  ah.tasp_name,\n  ah.cusip,\n  ah.ticker\nORDER BY\n  ah.tax_country ASC,\n  ah.issue_name ASC;"
