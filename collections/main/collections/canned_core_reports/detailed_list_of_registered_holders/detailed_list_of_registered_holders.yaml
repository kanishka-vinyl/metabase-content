dataset_query:
  database: Canned DB
  stages:
  - native: |2
       WITH as_of_date AS (
        SELECT MAX(date) AS selected_date
        FROM datamart.a_registered_owner_canned_report t
        WHERE 1=1
        [[AND {{Date_Range}}]]
      ),
      filtered_holdings AS (
        SELECT *
        FROM datamart.a_registered_owner_canned_report t
        CROSS JOIN as_of_date a
        WHERE
          1=1
          AND t.reversed_at IS NULL
          AND t.date <= a.selected_date
          [[AND {{Issuer_Name}}]]
          [[AND {{Issue_Name}}]]
          [[AND {{issuer_id}}]]
          [[AND {{tasp_id}}]]
          [[AND {{Date_Range}}]]

      ),
      active_holdings AS (
        SELECT
          fh.*,
      CASE
        WHEN fh.cancel_transaction_datetime IS NULL
          OR fh.cancel_transaction_datetime::date > fh.selected_date
        THEN 'Active'::text
        ELSE 'Inactive'::text
      END AS dynamic_status
        FROM filtered_holdings fh
      )



      SELECT
        ah.legal_name                             AS "Legal Name",
        ah.holder_type                            AS "Holder Type",
        ah.holder_subtype                         AS "Holder Subtype",
        ah.registered_owner_tin                   AS "Registered Owner TIN",
        ah.holding_type                           AS "Holding Type",
        ah.drs_book_account_or_certificate_number AS "DRS/Book Certificate Number",
        ah.issue_date                             AS "Issue Date",
        ah.quantity                               AS "Quantity",
        ah.position_stop                          AS "Position Stop",
        ah.holder_stop                            AS "Holder Stop",
        ah.legends_or_stops                       AS "Legends or Stops",
        ah.acquisition_date                       AS "Acquisition Date",
        ah.cost_basis                             AS "Cost Basis",
        ah.gift_inheritance_indicator             AS "Gift/Inheritance Indicator",
        ah.gift_fmv                               AS "Gift FMV",
        ah.tax_country                            AS "Tax Country",
        ah.street_address                         AS "Street Address",
        ah.country                                AS "Country",
        ah.state                                  AS "State",
        ah.city                                   AS "City",
        ah.postal_code                            AS "Postal Code",
        ah.email_address                          AS "Email Address",
        ah.phone_number                           AS "Phone Number",
        ah.lost_holder                            AS "Lost Holder",
        ah.date_of_last_contact                   AS "Date of Last Contact",
        ah.affiliate                              AS "Affiliate",
        ah.section_16_officer                     AS "Section 16 Officer",
        ah.dynamic_status                         AS "Status",
        ah.associated_user_name_1                 AS "Associated User Name 1",
        ah.associated_user_tin_1                  AS "Associated User TIN 1",
        ah.associated_user_name_2                 AS "Associated User Name 2",
        ah.associated_user_tin_2                  AS "Associated User TIN 2",
        ah.associated_user_name_3                 AS "Associated User Name 3",
        ah.associated_user_tin_3                  AS "Associated User TIN 3",
        ah.cancel_transaction_date                AS "Cancel Transaction Date",
        ah.cancel_transaction_type                AS "Cancel Transaction Type",
        ah.tax_lot_status                         AS "Tax Lot Status",
        ah.holdings_range                         AS "Holdings Range",
        ah.holdings_range_order                   AS "Holdings Range Order",
        ah.corrected                              AS "Corrected",
        ah.reported_to_irs                        AS "Reported to IRS",
        ah.issue_name                             AS "Issue Name",
        ah.cusip                                  AS "CUSIP",
        ah.ticker                                 AS "Ticker",
        ah.issuer_id                              AS "Issuer ID",
        ah.issuer_legal_name                      AS "Issuer Legal Name",
        ah.issuer_issue                           AS "Issuer Issue",
        ah.tasp_name                              AS "TASP Name",
        ah.tasp_id                                AS "TASP ID"
      FROM active_holdings ah
      WHERE
        1=1
        [[AND ah.dynamic_status = {{Status}}]]
      ORDER BY
        ah.legal_name ASC,
        ah.issue_date ASC;
