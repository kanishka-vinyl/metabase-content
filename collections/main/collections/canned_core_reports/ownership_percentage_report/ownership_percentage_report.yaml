dataset_query:
  database: Canned DB
  stages:
  - native: "WITH filtered_holdings AS (\n  SELECT\n    t.tax_lot_id,\n    t.stakeholder_id,\n    t.issue_id,\n    t.issue_name,\n    t.issuer_legal_name,\n    t.legal_name,\n    t.holder_type,\n    t.registered_owner_tin,\n    t.quantity,\n    t.cancel_transaction_date,\n    t.issuer_issue,\n    t.issue_date,\n    t.tasp_name,\n\tt.cusip,\n\tt.ticker\n  FROM\n    datamart.a_ownership_percent_holders_report t\n  WHERE\n    1=1\n    AND t.reversed_at IS NULL\n    AND t.transaction_type <> 'CANCELLATION'\n\n\n[[AND {{Issuer_Name}}]]\n[[AND {{Issue_Name}}]]\n[[AND {{Date_Range}}]]\n[[AND {{Issuer_id}}]]\n[[AND {{tasp_id}}]]\n),\n-- Get the latest issue_date from filtered dataset (dynamic as of date)\nas_of_date AS (\n  SELECT MAX(issue_date) AS selected_date\n  FROM filtered_holdings\n),\n-- Only keep active lots as of the selected date\nactive_holdings AS (\n  SELECT\n    fh.*\n  FROM\n    filtered_holdings fh\n    CROSS JOIN as_of_date a\n  WHERE\n    fh.cancel_transaction_date IS NULL\n    OR NULLIF(fh.cancel_transaction_date, '')::date > a.selected_date\n),\n-- Aggregate quantity per stakeholder per issue\naggregated_holdings AS (\n  SELECT\n    ah.issue_id,\n    ah.issue_name,\n    ah.issuer_issue,\n    ah.issuer_legal_name,\n    ah.legal_name,\n    ah.holder_type,\n    ah.registered_owner_tin,\n    ah.tasp_name,\n\tah.cusip,\n\tah.ticker,\n    SUM(ah.quantity) AS qty\n  FROM active_holdings ah\n  GROUP BY\n    ah.issue_id,\n    ah.issue_name,\n    ah.issuer_issue,\n    ah.issuer_legal_name,\n    ah.legal_name,\n    ah.holder_type,\n    ah.registered_owner_tin,\n    ah.tasp_name,\n\tah.cusip,\n\tah.ticker\n),\n-- Calculate percentage using total issued and outstanding per issue\nwith_percentage AS (\n  SELECT\n    ah.*,\n    'Active' AS status,\n    ROUND(\n      (\n        ah.qty * 100.0 /\n        NULLIF(SUM(ah.qty) OVER (PARTITION BY ah.issue_id), 0)\n      ),\n      2\n    ) AS percentage\n  FROM aggregated_holdings ah\n),\n-- Get latest non-quantity details per stakeholder per issue\nlatest_details AS (\n  SELECT DISTINCT ON (\n      d.issue_id,\n      d.legal_name,\n      d.holder_type,\n      d.registered_owner_tin\n    )\n    d.issue_id,\n    d.legal_name,\n    d.holder_type,\n    d.registered_owner_tin,\n    d.mailing_address,\n    d.email_address,\n    d.phone,\n    d.lost_holder,\n    d.date_of_last_contact,\n    d.affiliate,\n    d.section_16_officer,\n    d.holder_stop\n  FROM datamart.a_ownership_percent_holders_report d\n  WHERE\n    d.reversed_at IS NULL\n    AND d.transaction_type <> 'CANCELLATION'\n  ORDER BY\n    d.issue_id,\n    d.legal_name,\n    d.holder_type,\n    d.registered_owner_tin,\n    d.issue_date DESC\n)\nSELECT\n  wp.legal_name                                               AS \"Registered Owner Name\",\n  wp.holder_type                                              AS \"Holder Type\",\n  wp.registered_owner_tin                                     AS \"Registered Owner TIN\",\n  wp.qty                                                      AS \"Total Quantity Held\",\n  wp.percentage                                               AS \"Percentage\",\n  wp.status                                                   AS \"Status\",\n  ld.mailing_address                                          AS \"Address\",\n  ld.email_address                                            AS \"Email Address\",\n  ld.phone                                                    AS \"Phone\",\n  ld.lost_holder                                              AS \"Lost Holder\",\n  TO_CHAR(ld.date_of_last_contact, 'YYYY-MM-DD')              AS \"Date of Last Contact\",\n  ld.affiliate                                                AS \"Affiliate\",\n  ld.section_16_officer                                       AS \"Section 16 Officer\",\n  ld.holder_stop                                              AS \"Holder Stop\",\n  wp.cusip                                                    AS \"Cusip\",\n  wp.ticker                                                   AS \"Ticker\",\n  wp.issue_name                                               AS \"Issue Name\",\n  wp.issuer_issue                                             AS \"Issuer Issue\",\n  wp.issuer_legal_name                                        AS \"Issuer Legal Name\",\n  wp.tasp_name                                                AS \"TASP Name\"\nFROM with_percentage wp\nLEFT JOIN latest_details ld\n  ON  ld.issue_id             = wp.issue_id\n  AND ld.legal_name           = wp.legal_name\n  AND ld.holder_type          = wp.holder_type\n  AND ld.registered_owner_tin = wp.registered_owner_tin\nWHERE\n  1=1\n  [[AND wp.percentage >= {{percentage_filter}}]]\nORDER BY\n  wp.legal_name ASC,\n  wp.holder_type ASC,\n  wp.registered_owner_tin ASC;"
