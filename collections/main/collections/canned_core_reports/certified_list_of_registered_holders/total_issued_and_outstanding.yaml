dataset_query:
  database: Canned DB
  stages:
  - native: "-- Question 1: Total Issued & Outstanding\n-- Display as: Number card on dashboard\n\nWITH as_of_date AS (\n  SELECT MAX(issue_date) AS selected_date\n  FROM datamart.a_certified_list_of_registered_holders t\n  WHERE 1=1\n  [[AND {{Date_Range}}]]\n),\nfiltered_holdings AS (\n  SELECT\n    t.quantity,\n    t.cancel_transaction_date,\n    t.issue_date,\n    t.issue_id,\n\tt.issuer_id,\n\tt.tasp_id\n  FROM\n    datamart.a_certified_list_of_registered_holders t\n  WHERE\n    1=1\n    AND t.reversed_at IS NULL\n    AND t.transaction_type <> 'CANCELLATION'\n    AND t.tax_lot_is_deleted IS NOT TRUE\n    [[AND {{Issuer_Name}}]]\n    [[AND {{Issue_Name}}]]\n    [[AND {{Date_Range}}]]\n\t[[AND {{Issuer_Id}}]]\n    [[AND {{Tasp_Id}}]]\n),\nactive_holdings AS (\n  SELECT fh.*\n  FROM filtered_holdings fh\n  CROSS JOIN as_of_date a\n  WHERE\n    fh.cancel_transaction_date IS NULL\n    OR NULLIF(fh.cancel_transaction_date, '')::date > a.selected_date\n)\nSELECT\n  SUM(quantity) AS \"Total Issued & Outstanding\"\nFROM active_holdings;"
