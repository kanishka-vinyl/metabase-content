dataset_query:
  database: Canned DB
  stages:
  - native: "WITH as_of_date AS (\n  SELECT MAX(issue_date) AS selected_date\n  FROM datamart.a_certified_list_of_registered_holders t\n  WHERE 1=1\n  [[AND {{Date_Range}}]]\n),\nfiltered_holdings AS (\n  SELECT\n    t.tax_lot_id,\n    t.stakeholder_id,\n    t.issue_id,\n    t.registered_owner_id,\n    t.legal_name,\n    t.quantity,\n    t.cancel_transaction_date,\n    t.issuer_issue,\n    t.issue_date,\n    t.issue_name,\n    t.issuer_legal_name,\n\tt.issuer_id,\n    t.tasp_name,\n\tt.tasp_id,\n    t.cusip,\n    t.ticker\n  FROM\n    datamart.a_certified_list_of_registered_holders t\n  WHERE\n    1=1\n    AND t.reversed_at IS NULL\n    AND t.transaction_type <> 'CANCELLATION'\n    AND t.tax_lot_is_deleted IS NOT TRUE\n    [[AND {{Issuer_Name}}]]\n    [[AND {{Issue_Name}}]]\n    [[AND {{Date_Range}}]]\n\t[[AND {{issuer_id}}]]\n\t[[AND {{tasp_id}}]]\n),\n-- Only keep active lots as of the user selected date\nactive_holdings AS (\n  SELECT fh.*\n  FROM filtered_holdings fh\n  CROSS JOIN as_of_date a\n  WHERE\n    fh.cancel_transaction_date IS NULL\n    OR NULLIF(fh.cancel_transaction_date, '')::date > a.selected_date\n),\n-- Aggregate total quantity per registered owner per issue\naggregated_holdings AS (\n  SELECT\n    ah.issue_id,\n    ah.registered_owner_id,\n    ah.issue_name,\n    ah.issuer_issue,\n    ah.issuer_legal_name,\n\tah.issuer_id,\n    ah.tasp_name,\n\tah.tasp_id,\n    ah.cusip,\n    ah.ticker,\n    SUM(ah.quantity) AS total_quantity\n  FROM active_holdings ah\n  GROUP BY\n    ah.issue_id,\n    ah.registered_owner_id,\n    ah.issue_name,\n    ah.issuer_issue,\n    ah.issuer_legal_name,\n\tah.issuer_id,\n    ah.tasp_name,\n\tah.tasp_id,\n    ah.cusip,\n    ah.ticker\n),\n-- Get latest non-quantity details per registered owner per issue\nlatest_details AS (\n  SELECT DISTINCT ON (\n      d.issue_id,\n      d.registered_owner_id\n    )\n    d.issue_id,\n    d.registered_owner_id,\n    d.legal_name,\n    d.mailing_address,\n    d.email_address\n  FROM datamart.a_certified_list_of_registered_holders d\n  WHERE\n    d.reversed_at IS NULL\n    AND d.transaction_type <> 'CANCELLATION'\n    AND d.tax_lot_is_deleted IS NOT TRUE\n  ORDER BY\n    d.issue_id,\n    d.registered_owner_id,\n    d.issue_date DESC\n)\nSELECT\n  ld.legal_name                             AS \"Registered Owner Name\",\n  ld.mailing_address                        AS \"Address\",\n  ld.email_address                          AS \"Email Address\",\n  ah.total_quantity                         AS \"Total Holdings\",\n  ah.cusip                                  AS \"CUSIP\",\n  ah.ticker                                 AS \"Ticker\",\n  ah.issue_name                             AS \"Issue Name\",\n  ah.issuer_issue                           AS \"Issuer Issue\",\n  ah.issuer_legal_name                      AS \"Issuer Legal Name\",\n  ah.issuer_id                              AS \"issuer_id\",\n  ah.tasp_id                                AS \"tasp_id\",\n  ah.tasp_name                              AS \"TASP Name\"\nFROM aggregated_holdings ah\nLEFT JOIN latest_details ld\n  ON  ld.issue_id            = ah.issue_id\n  AND ld.registered_owner_id = ah.registered_owner_id\nORDER BY\n  ld.legal_name ASC,\n  ah.issue_name ASC;"
